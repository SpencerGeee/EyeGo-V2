<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Track your EyeGo ride in real time" />
  <meta name="theme-color" content="#08090B" />
  <title>Track Your EyeGo Ride</title>
  <link href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /*
      THE BRAND, NOT A STOCK PURPLE.

      This page was #6C63FF on #0a0a0f — a palette that belongs to no part of
      EyeGo. It is the first thing a rider's friend or family ever sees of the
      product, arriving as a link, and it looked like a different company's.
      These are the rider app's own tokens: the onyx surfaces and the #4be277
      brand green, with the same soft green bloom the app puts behind its
      primary surfaces.
    */
    :root {
      --bg: #08090B;
      --surface: #131316;
      --surface2: #1B1B1F;
      --surface3: #222225;
      --border: rgba(255,255,255,0.09);
      --primary: #4be277;
      --primary-dim: #1FAE52;
      --primary-soft: rgba(75,226,119,0.14);
      --primary-glow: rgba(75,226,119,0.30);
      --text: #DCE4E5;
      --text-dim: rgba(220,228,229,0.55);
      --success: #4be277;
      --warning: #f59e0b;
      --error: #ef4444;
      --radius: 20px;
      --sheet-radius: 28px;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #map { position: absolute; inset: 0; }

    /* ── Top bar ─────────────────────────────────────────────── */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: calc(14px + env(safe-area-inset-top)) 18px 28px;
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(to bottom, rgba(8,9,11,0.92) 30%, rgba(8,9,11,0.45) 70%, transparent);
      z-index: 10; pointer-events: none;
    }
    #topbar .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(140deg, var(--primary), var(--primary-dim));
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    #topbar .titles { min-width: 0; flex: 1; }
    #topbar .t { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
    #topbar .s {
      font-size: 12px; color: var(--text-dim); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #status-badge {
      pointer-events: none; flex-shrink: 0;
      padding: 6px 11px; border-radius: 999px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      border: 1px solid transparent; white-space: nowrap;
    }
    .badge-scheduled { background: rgba(245,158,11,0.14); color: var(--warning); border-color: rgba(245,158,11,0.35) !important; }
    .badge-enroute   { background: var(--primary-soft); color: var(--primary); border-color: rgba(75,226,119,0.38) !important; }
    .badge-inprogress{ background: rgba(75,226,119,0.20); color: var(--primary); border-color: rgba(75,226,119,0.5) !important; }

    /* ── The sheet ───────────────────────────────────────────────
       Draggable. It used to be a fixed block pinned to the bottom, which is
       the "the card also seems to be stuck so you can[’t] move it around"
       report: on a short screen the lower half was simply unreachable, and
       there was no way to get it out of the way to see the map either. */
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      z-index: 20;
      background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
      border-top: 1px solid var(--border);
      border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
      box-shadow: 0 -18px 50px rgba(0,0,0,0.55), 0 -1px 0 rgba(75,226,119,0.12);
      padding: 0 18px calc(18px + env(safe-area-inset-bottom));
      max-height: 88vh;
      display: flex; flex-direction: column;
      touch-action: none;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    #sheet.dragging { transition: none; }
    #grabber-zone { padding: 10px 0 6px; cursor: grab; flex-shrink: 0; }
    #grabber-zone:active { cursor: grabbing; }
    #grabber {
      width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.22); margin: 0 auto;
    }
    #sheet-scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      position: relative;
    }
    /* The soft green rim the app puts on its live surfaces. */
    .card.lit {
      border-color: rgba(75,226,119,0.30);
      box-shadow: 0 0 0 1px rgba(75,226,119,0.06), 0 8px 30px rgba(75,226,119,0.09);
    }

    /* ── ETA ── */
    #eta-card { display: none; align-items: center; gap: 14px; }
    #eta-num {
      font-size: 34px; font-weight: 800; letter-spacing: -1.5px; line-height: 1;
      color: var(--primary); font-variant-numeric: tabular-nums;
    }
    #eta-unit { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
    #eta-label { font-size: 14px; font-weight: 650; }
    #eta-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    #eta-divider { width: 1px; align-self: stretch; background: var(--border); }

    /* ── Driver ── */
    #driver-card { display: none; align-items: center; gap: 12px; }
    #driver-avatar {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface3); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; color: var(--primary);
      border: 1.5px solid rgba(75,226,119,0.35);
    }
    #driver-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #driver-name { font-size: 15px; font-weight: 650; }
    #driver-vehicle { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    #driver-plate {
      font-size: 12px; font-weight: 700; letter-spacing: 0.6px;
      padding: 5px 9px; border-radius: 8px;
      background: var(--surface3); border: 1px solid var(--border);
      flex-shrink: 0; font-variant-numeric: tabular-nums;
    }

    /* ── Route ── */
    .route-row { display: flex; gap: 12px; align-items: flex-start; }
    .route-rail { display: flex; flex-direction: column; align-items: center; padding-top: 5px; }
    .rail-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .rail-line { width: 2px; flex: 1; min-height: 22px; background: var(--border); margin: 3px 0; }
    .route-label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .route-value { font-size: 14px; font-weight: 600; margin-top: 1px; word-break: break-word; }

    /* ── Seats ── */
    #seat-indicator { display: none; align-items: center; gap: 10px; }
    #seat-dots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    .seat-dot { width: 11px; height: 11px; border-radius: 3px; }
    .seat-dot.taken { background: var(--primary); }
    .seat-dot.free  { background: var(--surface3); border: 1px solid var(--border); }
    #seat-text { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* ── CTA ── */
    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; border-radius: 14px;
      font-size: 14.5px; font-weight: 700; text-decoration: none;
      border: none; cursor: pointer;
    }
    .cta-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dim));
      color: #05210f;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    /* ── Map pins ── */
    .pin {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2.5px solid var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .pin-inner { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); }
    .pin-pickup { background: #ffffff; box-shadow: 0 0 0 4px rgba(255,255,255,0.16); }
    .pin-dest   { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

    /* ── Loading / error / end states ── */
    #loading, #end-state {
      position: absolute; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 32px; text-align: center; background: var(--bg);
    }
    #end-state { display: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--surface3); border-top-color: var(--primary);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .end-icon {
      width: 68px; height: 68px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .end-title { font-size: 20px; font-weight: 750; letter-spacing: -0.3px; }
    .end-body { font-size: 13.5px; color: var(--text-dim); max-width: 320px; line-height: 1.55; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#05210f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
    </svg>
  </div>
  <div class="titles">
    <div class="t">EyeGo</div>
    <div class="s" id="topbar-sub">Live trip</div>
  </div>
  <div id="status-badge" class="badge-scheduled">Loading</div>
</div>

<div id="sheet">
  <div id="grabber-zone"><div id="grabber"></div></div>
  <div id="sheet-scroll">

    <div class="card lit" id="eta-card">
      <div>
        <div id="eta-num">--</div>
        <div id="eta-unit">min</div>
      </div>
      <div id="eta-divider"></div>
      <div style="flex:1;min-width:0">
        <div id="eta-label">Arriving</div>
        <div id="eta-sub"></div>
      </div>
    </div>

    <div class="card" id="driver-card">
      <div id="driver-avatar"><span id="driver-avatar-inner">D</span></div>
      <div style="flex:1;min-width:0">
        <div id="driver-name">Driver</div>
        <div id="driver-vehicle"></div>
      </div>
      <div id="driver-plate"></div>
    </div>

    <div class="card">
      <div class="route-row">
        <div class="route-rail">
          <div class="rail-dot" style="background:#ffffff"></div>
          <div class="rail-line"></div>
          <div class="rail-dot" style="background:var(--primary)"></div>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:18px">
          <div>
            <div class="route-label">Pickup</div>
            <div class="route-value" id="origin-name">—</div>
          </div>
          <div>
            <div class="route-label">Destination</div>
            <div class="route-value" id="dest-name">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="seat-indicator">
      <div id="seat-dots"></div>
      <div id="seat-text"></div>
    </div>

    <a class="cta-btn cta-primary" id="app-link" href="#">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
      Open in the EyeGo app
    </a>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div class="end-body">Loading trip…</div>
</div>

<div id="end-state">
  <div class="end-icon" id="end-icon"></div>
  <div class="end-title" id="end-title"></div>
  <div class="end-body" id="end-body"></div>
  <a class="cta-btn cta-primary" style="max-width:260px;margin-top:8px" href="https://eyego.app/download">Download EyeGo</a>
</div>

<script>
(function () {
  // ── Config injected by Express ─────────────────────────────
  const CONFIG = window.__EYEGO_CONFIG__ || {};
  const SHORT_ID = CONFIG.shortId;
  const API_BASE = CONFIG.apiBase || '';
  const POLL_INTERVAL_MS = 5000;

  if (!SHORT_ID) {
    showError('No trip ID in link.');
    return;
  }

  // ── MapLibre GL JS setup (OpenFreeMap tiles, no API key needed) ──
  //
  // The map is strictly OPTIONAL. `maplibregl` comes from unpkg over the
  // recipient's own connection, so if that CDN is slow, blocked or simply
  // fails (entirely normal on mobile data) the constructor throws — and this
  // whole file is one IIFE, so a throw here used to abort everything below it:
  // no fetch, no render, no error state, just the spinner forever. If the map
  // can't be built, `map` stays null, every map-touching branch is guarded,
  // and the trip details — which are the point of the page — still render.
  let map = null;
  const mapEl = document.getElementById('map');
  try {
    if (typeof maplibregl === 'undefined') throw new Error('maplibre-gl failed to load');
    map = buildMap();
  } catch (mapErr) {
    console.warn('Map unavailable — showing trip details only', mapErr);
    if (mapEl) mapEl.style.display = 'none';
  }

  function buildMap() {
    const m = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        name: 'EyeGo Onyx',
        sources: {
          openfreemap: {
            type: 'vector',
            // TileJSON endpoint, NOT a {z}/{x}/{y} template. OpenFreeMap
            // publishes `/planet` as TileJSON (what the native styles use); a
            // hand-written tile template 404s on every tile, so the map draws
            // nothing but its background colour.
            url: 'https://tiles.openfreemap.org/planet',
            attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> · <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
          }
        },
        glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
        layers: [
          { id: 'background', type: 'background', paint: { 'background-color': '#08090B' } },
          { id: 'water', type: 'fill', source: 'openfreemap', 'source-layer': 'water', paint: { 'fill-color': '#0C1A16' } },
          { id: 'building', type: 'fill', source: 'openfreemap', 'source-layer': 'building', paint: { 'fill-color': '#17171C', 'fill-opacity': 0.75, 'fill-outline-color': '#22222A' } },
          { id: 'road-minor', type: 'line', source: 'openfreemap', 'source-layer': 'transportation', filter: ['in', 'class', 'minor', 'service'], paint: { 'line-color': '#1F1F27', 'line-width': ['interpolate',['linear'],['zoom'],12,0.5,16,2] } },
          { id: 'road-major', type: 'line', source: 'openfreemap', 'source-layer': 'transportation', filter: ['in', 'class', 'primary', 'secondary', 'tertiary'], paint: { 'line-color': '#282833', 'line-width': ['interpolate',['linear'],['zoom'],10,1,16,4] } },
          { id: 'road-highway', type: 'line', source: 'openfreemap', 'source-layer': 'transportation', filter: ['in', 'class', 'motorway', 'trunk'], paint: { 'line-color': '#2C3A2E', 'line-width': ['interpolate',['linear'],['zoom'],8,1.5,16,6], 'line-opacity': 0.85 } }
        ]
      },
      center: [-0.186964, 5.603717],
      zoom: 12,
      attributionControl: false,
    });
    m.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
    return m;
  }

  // ── Draggable sheet ──────────────────────────────────────────
  //
  // Two positions: open (as laid out) and peeked (dragged down so only the ETA
  // and the grabber show, revealing the map). A drag past a third of the
  // travel, or a flick, commits; anything less springs back.
  const sheet = document.getElementById('sheet');
  const grabZone = document.getElementById('grabber-zone');
  const scroller = document.getElementById('sheet-scroll');
  let peeked = false;
  let dragStartY = null;
  let dragStartT = 0;
  let peekOffset = 0;

  function measurePeek() {
    // Leave the grabber and the first card visible when peeked.
    peekOffset = Math.max(0, sheet.offsetHeight - 132);
  }
  function applySheet(px) {
    sheet.style.transform = 'translateY(' + px + 'px)';
  }
  function settle(next) {
    peeked = next;
    sheet.classList.remove('dragging');
    applySheet(peeked ? peekOffset : 0);
  }
  window.addEventListener('resize', () => { measurePeek(); applySheet(peeked ? peekOffset : 0); });

  function dragStart(y) {
    measurePeek();
    dragStartY = y;
    dragStartT = Date.now();
    sheet.classList.add('dragging');
  }
  function dragMove(y) {
    if (dragStartY === null) return;
    const base = peeked ? peekOffset : 0;
    // Rubber-band past the ends rather than letting the sheet fly off.
    let next = base + (y - dragStartY);
    if (next < 0) next = next / 3;
    if (next > peekOffset) next = peekOffset + (next - peekOffset) / 3;
    applySheet(next);
  }
  function dragEnd(y) {
    if (dragStartY === null) return;
    const dy = y - dragStartY;
    const dt = Math.max(1, Date.now() - dragStartT);
    const flick = Math.abs(dy) / dt > 0.5;
    const threshold = peekOffset / 3;
    if (flick) settle(dy > 0);
    else if (peeked) settle(dy > -threshold);
    else settle(dy > threshold);
    dragStartY = null;
  }

  grabZone.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientY), { passive: true });
  grabZone.addEventListener('touchmove', (e) => dragMove(e.touches[0].clientY), { passive: true });
  grabZone.addEventListener('touchend', (e) => dragEnd(e.changedTouches[0].clientY));
  grabZone.addEventListener('mousedown', (e) => {
    dragStart(e.clientY);
    const mv = (ev) => dragMove(ev.clientY);
    const up = (ev) => {
      dragEnd(ev.clientY);
      window.removeEventListener('mousemove', mv);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', up);
  });
  // Dragging the body works too, but only when the content is scrolled to the
  // top — otherwise a downward swipe is the user trying to scroll the card.
  scroller.addEventListener('touchstart', (e) => {
    if (scroller.scrollTop <= 0) dragStart(e.touches[0].clientY);
  }, { passive: true });
  scroller.addEventListener('touchmove', (e) => {
    if (dragStartY !== null) dragMove(e.touches[0].clientY);
  }, { passive: true });
  scroller.addEventListener('touchend', (e) => dragEnd(e.changedTouches[0].clientY));
  grabZone.addEventListener('click', () => { measurePeek(); settle(!peeked); });

  // ── State ────────────────────────────────────────────────────
  let vanMarkerEl = null;
  let vanMarker = null;
  let originMarker = null;
  let destMarker = null;
  let tripData = null;
  let pollTimer = null;
  let didFitBounds = false;
  let lastGeometryKey = '';

  // ── Fetch & render ───────────────────────────────────────────
  async function fetchAndRender() {
    try {
      // Hard timeout: a request that never settles leaves the spinner up
      // forever, because the `catch` below can only run if the promise rejects.
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timeout = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
      const res = await fetch(`${API_BASE}/v1/trips/track/${SHORT_ID}/data`, {
        signal: ctrl ? ctrl.signal : undefined,
      }).finally(() => { if (timeout) clearTimeout(timeout); });
      if (!res.ok) {
        if (res.status === 404) {
          showError('Trip not found or link has expired.');
        } else if (!tripData) {
          // Only surface an error on the FIRST failed load — once tripData is
          // populated, a later poll hiccup shouldn't blank out a working page.
          showError('Could not load trip details.');
        }
        return;
      }
      const json = await res.json();
      tripData = json.data ?? json;
      render(tripData);
    } catch (e) {
      console.warn('Poll failed', e);
      if (!tripData) showError('Could not load trip details. Check your connection and try again.');
    }
  }

  function render(data) {
    document.getElementById('loading').classList.add('hidden');

    const status = data.status;

    // ── End states ───────────────────────────────────────────
    if (status === 'COMPLETED') {
      stopPolling();
      showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4be277" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>', 'Ride complete', 'This EyeGo ride has finished. Thanks for riding with us.');
      return;
    }
    if (status === 'CANCELLED') {
      stopPolling();
      showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>', 'Trip cancelled', 'This trip was cancelled. Open the EyeGo app to book a new ride.');
      return;
    }

    // ── Status badge ─────────────────────────────────────────
    const badge = document.getElementById('status-badge');
    const badgeMap = {
      SCHEDULED: ['badge-scheduled', 'Scheduled'],
      FILLING: ['badge-scheduled', 'Filling seats'],
      MATCHING: ['badge-scheduled', 'Finding a driver'],
      DRIVER_ASSIGNED: ['badge-enroute', 'Driver assigned'],
      DRIVER_EN_ROUTE: ['badge-enroute', 'On the way'],
      ARRIVED_AT_PICKUP: ['badge-enroute', 'Driver arrived'],
      IN_PROGRESS: ['badge-inprogress', 'In progress'],
    };
    const [cls, label] = badgeMap[status] || ['badge-scheduled', String(status || '').replace(/_/g, ' ').toLowerCase()];
    badge.className = cls;
    badge.textContent = label;

    if (data.route) {
      document.getElementById('topbar-sub').textContent =
        `${data.route.originName} → ${data.route.destinationName}`;
      document.getElementById('origin-name').textContent = data.route.originName;
      document.getElementById('dest-name').textContent = data.route.destinationName;
    }

    /*
      ── ETA ───────────────────────────────────────────────────
      THE SAME NUMBER THE APPS SHOW.

      This used to count down to `departureTime` and call it an ETA. A
      departure time and a driver's ETA are different quantities, which is why
      the web page said 64 minutes while both apps said 16 — nothing was
      miscalculated, they were two different clocks. `path.etaMinutes` comes
      from the same route-geometry service the apps read, and `path.leg` says
      which journey it measures, so the label cannot claim the driver is
      arriving at the destination while they are still coming to the pickup.
    */
    const etaCard = document.getElementById('eta-card');
    const path = data.path;
    if (path && path.etaMinutes != null) {
      etaCard.style.display = 'flex';
      document.getElementById('eta-num').textContent = String(path.etaMinutes);
      const toPickup = path.leg === 'toPickup';
      document.getElementById('eta-label').textContent = toPickup ? 'Driver arriving' : 'Arriving at destination';
      document.getElementById('eta-sub').textContent =
        (toPickup ? (data.route ? data.route.originName : 'your pickup') : (data.route ? data.route.destinationName : 'your destination'))
        + (path.distanceKm != null ? ` · ${path.distanceKm} km` : '');
    } else if (data.departureTime && status !== 'IN_PROGRESS') {
      // No live leg yet (nobody assigned). Say plainly that this is a
      // scheduled departure rather than dressing it up as an ETA.
      const dep = new Date(data.departureTime);
      etaCard.style.display = 'flex';
      const mins = Math.round((dep.getTime() - Date.now()) / 60000);
      document.getElementById('eta-num').textContent = mins > 0 ? String(mins) : '--';
      document.getElementById('eta-label').textContent = 'Departs';
      document.getElementById('eta-sub').textContent = dep.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } else {
      etaCard.style.display = 'none';
    }

    // ── Driver card ───────────────────────────────────────────
    if (data.driver) {
      document.getElementById('driver-card').style.display = 'flex';
      document.getElementById('driver-name').textContent = data.driver.name || 'Driver';
      const inner = document.getElementById('driver-avatar-inner');
      if (data.driver.profilePhoto) {
        const img = document.createElement('img');
        img.src = data.driver.profilePhoto;
        img.alt = data.driver.name || 'Driver';
        inner.replaceChildren(img);
      } else {
        inner.textContent = (data.driver.name || 'D')[0].toUpperCase();
      }
    }
    if (data.vehicle) {
      document.getElementById('driver-vehicle').textContent = `${data.vehicle.make} ${data.vehicle.model} · ${data.vehicle.tier}`;
      document.getElementById('driver-plate').textContent = data.vehicle.plateNumber;
    }

    // ── Seat indicator ────────────────────────────────────────
    if (data.maxSeats) {
      const ind = document.getElementById('seat-indicator');
      ind.style.display = 'flex';
      const dots = document.getElementById('seat-dots');
      dots.replaceChildren();
      for (let i = 0; i < data.maxSeats; i++) {
        const d = document.createElement('div');
        d.className = `seat-dot ${i < data.confirmedSeats ? 'taken' : 'free'}`;
        dots.appendChild(d);
      }
      document.getElementById('seat-text').textContent = `${data.confirmedSeats}/${data.maxSeats} seats`;
    }

    document.getElementById('app-link').href = `eyego://track/${SHORT_ID}`;

    // ── Map ───────────────────────────────────────────────────
    if (!map) return;
    if (!map.isStyleLoaded()) map.once('idle', () => updateMap(data));
    else updateMap(data);
  }

  /** Round-headed pin, matching the apps' pickup (white) / destination (green). */
  function createPinEl(kind) {
    const el = document.createElement('div');
    el.className = 'pin ' + (kind === 'dest' ? 'pin-dest' : 'pin-pickup');
    const inner = document.createElement('div');
    inner.className = 'pin-inner';
    el.appendChild(inner);
    return el;
  }

  function updateMap(data) {
    if (!map) return;
    const route = data.route;
    const driver = data.driver;

    /*
      THE ROUTE, ON ROADS.

      This drew a two-point LineString from origin to destination — a straight
      line through buildings, which is what "the route is giving me a straight
      line, not following the road" means. There was nothing else it could
      draw: the endpoint sent no geometry at all. It now sends the same road
      polyline the apps render, and this uses it. When there is no line yet
      (nobody assigned), NOTHING is drawn — a straight line is not a rough
      approximation of a route, it is a wrong one.
    */
    const coords = data.path && data.path.geometry && Array.isArray(data.path.geometry.coordinates)
      ? data.path.geometry.coordinates
      : null;

    if (coords && coords.length > 1) {
      const key = coords.length + ':' + coords[0].join(',') + ':' + coords[coords.length - 1].join(',');
      const geojson = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
      if (!map.getSource('route-line')) {
        map.addSource('route-line', { type: 'geojson', data: geojson });
        // Casing under the line so it stays readable over pale roads.
        map.addLayer({
          id: 'route-casing', type: 'line', source: 'route-line',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#05130A', 'line-width': 9, 'line-opacity': 0.9 },
        });
        map.addLayer({
          id: 'route-line', type: 'line', source: 'route-line',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#4be277', 'line-width': 5 },
        });
      } else if (key !== lastGeometryKey) {
        map.getSource('route-line').setData(geojson);
      }
      lastGeometryKey = key;
    }

    /*
      END PINS. The line has to STOP somewhere visible — without a mark at the
      end, a route just trails off and the driver cannot tell where the rider
      actually asked to be dropped. Pickup gets one too whenever it is a
      distinct point from where the car already is.
    */
    if (route && !originMarker && route.originLng != null) {
      originMarker = new maplibregl.Marker({ element: createPinEl('origin'), anchor: 'center' })
        .setLngLat([route.originLng, route.originLat])
        .setPopup(new maplibregl.Popup({ offset: 18, closeButton: false }).setText(route.originName || 'Pickup'))
        .addTo(map);
    }
    if (route && !destMarker && route.destLng != null) {
      destMarker = new maplibregl.Marker({ element: createPinEl('dest'), anchor: 'center' })
        .setLngLat([route.destLng, route.destLat])
        .setPopup(new maplibregl.Popup({ offset: 18, closeButton: false }).setText(route.destinationName || 'Destination'))
        .addTo(map);
    }

    // Van marker — only when the driver has reported a location.
    if (driver && driver.lat != null && driver.lng != null) {
      if (!vanMarker) {
        vanMarkerEl = buildVanMarker();
        vanMarker = new maplibregl.Marker({ element: vanMarkerEl, anchor: 'center', rotationAlignment: 'map' })
          .setLngLat([driver.lng, driver.lat])
          .addTo(map);
      } else {
        vanMarker.setLngLat([driver.lng, driver.lat]);
      }
      if (driver.heading != null) vanMarker.setRotation(driver.heading);
    }

    // Frame everything once. Re-fitting on every poll would fight the viewer
    // every time they panned the map.
    if (!didFitBounds) {
      const pts = [];
      if (coords && coords.length) { pts.push(coords[0]); pts.push(coords[coords.length - 1]); }
      if (route && route.originLng != null) pts.push([route.originLng, route.originLat]);
      if (route && route.destLng != null) pts.push([route.destLng, route.destLat]);
      if (driver && driver.lat != null) pts.push([driver.lng, driver.lat]);
      if (pts.length >= 2) {
        const bounds = new maplibregl.LngLatBounds();
        pts.forEach((p) => bounds.extend(p));
        // A degenerate bbox (every point identical) makes fitBounds throw.
        if (!bounds.isEmpty() && bounds.getNorthEast().lng !== bounds.getSouthWest().lng) {
          map.fitBounds(bounds, { padding: { top: 110, bottom: 320, left: 50, right: 50 }, duration: 700, maxZoom: 15 });
          didFitBounds = true;
        }
      } else if (pts.length === 1) {
        map.easeTo({ center: pts[0], zoom: 14, duration: 600 });
        didFitBounds = true;
      }
    }
  }

  function buildVanMarker() {
    const el = document.createElement('div');
    el.style.cssText = 'width:38px;height:38px;display:flex;align-items:center;justify-content:center;';
    el.innerHTML =
      '<div style="position:absolute;width:38px;height:38px;border-radius:50%;background:rgba(75,226,119,0.20);"></div>' +
      '<div style="position:relative;width:26px;height:26px;border-radius:50%;background:#4be277;border:2.5px solid #08090B;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,0.5);">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="#05210f"><path d="M12 2l7 18-7-4-7 4z"/></svg>' +
      '</div>';
    return el;
  }

  function showError(msg) {
    document.getElementById('loading').classList.add('hidden');
    showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>', 'Trip unavailable', msg);
    stopPolling();
  }

  function showEndState(iconSvg, title, body) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('end-icon').innerHTML = iconSvg;
    document.getElementById('end-title').textContent = title;
    document.getElementById('end-body').textContent = body;
    document.getElementById('end-state').style.display = 'flex';
  }

  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  // Stop burning the recipient's battery and data while the tab is hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopPolling();
    else if (!pollTimer && tripData) {
      fetchAndRender();
      pollTimer = setInterval(fetchAndRender, POLL_INTERVAL_MS);
    }
  });

  measurePeek();
  fetchAndRender();
  pollTimer = setInterval(fetchAndRender, POLL_INTERVAL_MS);
})();
</script>
</body>
</html>
