<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Join a shared EyeGo ride" />
  <meta name="theme-color" content="#08090B" />
  <title>Join an EyeGo Ride</title>
  <!--
    THE MAP MUST NOT HOLD UP THE PAGE.

    BUGFIX ("it takes a while to load as well, you need to make sure it's very
    smooth and fast").

    This was a synchronous script tag from unpkg: the parser stopped dead until
    ~800 KB of MapLibre arrived, and everything after it — the stylesheet, the
    markup, the fetch for the ride itself — waited on a third-party CDN. On a
    Ghanaian mobile connection that is most of the wait, and it buys nothing,
    because the ride sheet is HTML and needs no map to render.

    `defer` lets parsing continue and `preconnect` warms the TLS handshake to
    both CDNs while the HTML is still being read. `fetchData()` no longer waits
    on the map either (see the DOM-ready handler at the bottom) — the sheet
    paints from the API, and the map draws whenever MapLibre turns up.
  -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <link href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" rel="stylesheet" />
  <script defer src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Same tokens as the tracking page and the rider app — this and /track are
       the two pages a stranger sees before they ever install anything, and they
       used to be a stock purple that belongs to no part of EyeGo. */
    :root {
      --bg: #08090B;
      --surface: #131316;
      --surface2: #1B1B1F;
      --surface3: #222225;
      --border: rgba(255,255,255,0.09);
      --primary: #4be277;
      --primary-dim: #1FAE52;
      --primary-soft: rgba(75,226,119,0.14);
      --primary-glow: rgba(75,226,119,0.30);
      --text: #DCE4E5;
      --text-dim: rgba(220,228,229,0.55);
      --warning: #f59e0b;
      --error: #ef4444;
      --radius: 20px;
      --sheet-radius: 28px;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #map { position: absolute; inset: 0; }

    /* ── Top bar ───────────────────────────────────────────────
       The status badge now lives INSIDE this flex row. It used to be its own
       absolutely-positioned element sitting on top of the bar, so on a narrow
       phone it landed straight over the "Accepting bookings" title — the
       reported overlap. In the flow it simply cannot collide: the title
       ellipsises and the badge keeps its width. */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: calc(14px + env(safe-area-inset-top)) 18px 28px;
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(to bottom, rgba(8,9,11,0.92) 30%, rgba(8,9,11,0.45) 70%, transparent);
      z-index: 10;
    }
    #topbar .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(140deg, var(--primary), var(--primary-dim));
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    #topbar .titles { min-width: 0; flex: 1; }
    #topbar .title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
    #topbar .subtitle {
      font-size: 12px; color: var(--text-dim); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #status-badge {
      flex-shrink: 0; white-space: nowrap;
      padding: 6px 11px; border-radius: 999px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-active { background: var(--primary-soft); color: var(--primary); border-color: rgba(75,226,119,0.38) !important; }
    .badge-full   { background: rgba(245,158,11,0.14); color: var(--warning); border-color: rgba(245,158,11,0.35) !important; }

    /* ── Sheet ── */
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      z-index: 20;
      background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
      border-top: 1px solid var(--border);
      border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
      box-shadow: 0 -18px 50px rgba(0,0,0,0.55), 0 -1px 0 rgba(75,226,119,0.12);
      padding: 0 18px calc(18px + env(safe-area-inset-bottom));
      max-height: 90vh;
      display: flex; flex-direction: column;
      touch-action: none;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    #sheet.dragging { transition: none; }
    #grabber-zone { padding: 10px 0 6px; cursor: grab; flex-shrink: 0; }
    #grabber-zone:active { cursor: grabbing; }
    #grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); margin: 0 auto; }
    #sheet-scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
    }
    .card.lit {
      border-color: rgba(75,226,119,0.30);
      box-shadow: 0 0 0 1px rgba(75,226,119,0.06), 0 8px 30px rgba(75,226,119,0.09);
    }
    .headline { font-size: 19px; font-weight: 750; letter-spacing: -0.35px; }
    .headline-sub { font-size: 13px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }

    /* ── Route ── */
    .route-row { display: flex; gap: 12px; align-items: flex-start; }
    .route-rail { display: flex; flex-direction: column; align-items: center; padding-top: 5px; }
    .rail-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .rail-line { width: 2px; flex: 1; min-height: 22px; background: var(--border); margin: 3px 0; }
    .route-label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .route-value { font-size: 14px; font-weight: 600; margin-top: 1px; word-break: break-word; }

    /* ── Details grid ── */
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .detail-label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-value { font-size: 15px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .detail-value.accent { color: var(--primary); }
    .detail-value.warning { color: var(--warning); }

    /* ── Driver ── */
    #driver-card { display: none; align-items: center; gap: 12px; }
    #driver-card.visible { display: flex; }
    #driver-avatar {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface3); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; color: var(--primary);
      border: 1.5px solid rgba(75,226,119,0.35);
    }
    #driver-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #driver-name { font-size: 15px; font-weight: 650; }
    #driver-vehicle { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    #driver-plate {
      font-size: 12px; font-weight: 700; letter-spacing: 0.6px;
      padding: 5px 9px; border-radius: 8px;
      background: var(--surface3); border: 1px solid var(--border);
      flex-shrink: 0; font-variant-numeric: tabular-nums;
    }

    /* ── Seats ── */
    #seat-indicator { display: none; align-items: center; gap: 10px; }
    #seat-indicator.visible { display: flex; }
    #seat-dots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    .seat-dot { width: 11px; height: 11px; border-radius: 3px; }
    .seat-dot.taken { background: var(--primary); }
    .seat-dot.free  { background: var(--surface3); border: 1px solid var(--border); }
    #seat-text { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* ── CTA ── */
    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; border-radius: 14px;
      font-size: 14.5px; font-weight: 700; text-decoration: none;
      border: none; cursor: pointer; margin-bottom: 8px;
    }
    .cta-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dim));
      color: #05210f; box-shadow: 0 8px 24px var(--primary-glow);
    }
    .cta-secondary { background: var(--surface3); color: var(--text); border: 1px solid var(--border); }

    /* ── Map pins ── */
    .pin { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--bg); display: flex; align-items: center; justify-content: center; }
    .pin-inner { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); }
    .pin-pickup { background: #ffffff; box-shadow: 0 0 0 4px rgba(255,255,255,0.16); }
    .pin-dest   { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

    /* ── Loading / end ── */
    #loading, #end-state {
      position: absolute; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 32px; text-align: center; background: var(--bg);
    }
    #end-state { display: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--surface3); border-top-color: var(--primary);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .end-icon {
      width: 68px; height: 68px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .end-title { font-size: 20px; font-weight: 750; letter-spacing: -0.3px; }
    .end-sub { font-size: 13.5px; color: var(--text-dim); max-width: 320px; line-height: 1.55; }
    .hidden { display: none !important; }

    /* Wide screens: the sheet becomes a side rail. */
    @media (min-width: 900px) {
      #map { left: 400px; }
      #topbar { left: 400px; }
      #sheet {
        right: auto; width: 400px; top: 0; bottom: 0;
        border-radius: 0; border-top: none; border-right: 1px solid var(--border);
        transform: none !important; padding-top: 12px;
      }
      #grabber-zone { display: none; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#05210f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
    </svg>
  </div>
  <div class="titles">
    <div class="title">EyeGo</div>
    <div class="subtitle" id="topbar-sub">Join this shared ride</div>
  </div>
  <div id="status-badge" class="badge-active">Active</div>
</div>

<div id="sheet">
  <div id="grabber-zone"><div id="grabber"></div></div>
  <div id="sheet-scroll">

    <div class="card lit">
      <div class="headline">You've been invited to ride</div>
      <div class="headline-sub">Grab a seat on this trip and split the journey. Booking happens in the EyeGo app.</div>
    </div>

    <div class="card">
      <div class="route-row">
        <div class="route-rail">
          <div class="rail-dot" style="background:#ffffff"></div>
          <div class="rail-line"></div>
          <div class="rail-dot" style="background:var(--primary)"></div>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:18px">
          <div>
            <div class="route-label">From</div>
            <div class="route-value" id="origin-name">—</div>
          </div>
          <div>
            <div class="route-label">To</div>
            <div class="route-value" id="dest-name">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="details">
        <div>
          <div class="detail-label">Departs</div>
          <div class="detail-value" id="departure-time">—</div>
        </div>
        <div>
          <div class="detail-label">Fare per seat</div>
          <div class="detail-value accent" id="fare-per-seat">—</div>
        </div>
        <div>
          <div class="detail-label">Seats left</div>
          <div class="detail-value" id="seats-left">—</div>
        </div>
        <div>
          <div class="detail-label">Status</div>
          <div class="detail-value" id="trip-status">—</div>
        </div>
      </div>
    </div>

    <div class="card" id="driver-card">
      <div id="driver-avatar"><span id="driver-avatar-inner">D</span></div>
      <div style="flex:1;min-width:0">
        <div id="driver-name">Driver</div>
        <div id="driver-vehicle"></div>
      </div>
      <div id="driver-plate"></div>
    </div>

    <div class="card" id="seat-indicator">
      <div id="seat-dots"></div>
      <div id="seat-text"></div>
    </div>

    <a id="app-link" class="cta-btn cta-primary" href="#">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Book your seat
    </a>
    <a id="download-link" class="cta-btn cta-secondary" target="_blank" rel="noopener" href="https://eyego.app/download">
      Download the app
    </a>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div class="end-sub">Loading ride…</div>
</div>

<div id="end-state">
  <div class="end-icon" id="end-icon"></div>
  <div class="end-title" id="end-title"></div>
  <div class="end-sub" id="end-sub"></div>
  <a class="cta-btn cta-primary" style="max-width:260px;margin-top:8px" href="https://eyego.app/download">Download EyeGo</a>
</div>

<script>
(function () {
  // ── Config injected by Express ─────────────────────────────
  const CONFIG = window.__EYEGO_CONFIG__ || {};
  const SHARE_TOKEN = CONFIG.shareToken;
  const API_BASE = CONFIG.apiBase || '';

  if (!SHARE_TOKEN) {
    showError('No invite link data.');
    return;
  }

  /**
   * THE MAP IS OPTIONAL — and this is why the page got "stuck".
   *
   * This whole file is one IIFE and the Map was constructed unguarded at the
   * top of it. `maplibregl` arrives from unpkg over the visitor's connection,
   * so a slow, blocked or failed CDN (routine on mobile data) left it
   * undefined, the constructor threw a ReferenceError, and every line below —
   * the fetch, the render, even the error state — never ran. All the visitor
   * ever saw was the spinner. The tracking page had already been fixed this
   * way; this one had not.
   */
  let map = null;
  const mapEl = document.getElementById('map');
  /**
   * Built LATE, on purpose.
   *
   * MapLibre is now `defer`red (see <head>) so it cannot block parsing or the
   * ride fetch. That means it is genuinely not loaded yet at this point in the
   * file — this inline script runs during parsing, deferred scripts run after
   * it — so constructing the map here would fail every single time and disable
   * the map permanently, which is a worse bug than the one `defer` fixes.
   *
   * `window.load` fires after deferred scripts have executed. If MapLibre still
   * is not there, the CDN really did fail and the page stays exactly as useful
   * as it was: the ride sheet does not need a map.
   */
  let lastRenderedData = null;
  function initMapWhenReady() {
    if (map || typeof maplibregl === 'undefined') {
      if (!map) {
        console.warn('Map unavailable — showing ride details only');
        if (mapEl) mapEl.style.display = 'none';
      }
      return;
    }
    try {
      map = buildMap();
      // The data almost always beats the map now. Redraw with whatever the
      // fetch already returned, or the map comes up empty and stays empty.
      if (lastRenderedData) {
        const r = (lastRenderedData.trip || lastRenderedData).route;
        const drawLate = () => { try { updateMap(r, lastRenderedData.path); } catch (e) { console.warn('Map draw failed', e); } };
        if (!map.isStyleLoaded()) map.once('idle', drawLate);
        else drawLate();
      }
    } catch (mapErr) {
      console.warn('Map unavailable — showing ride details only', mapErr);
      if (mapEl) mapEl.style.display = 'none';
    }
  }
  if (document.readyState === 'complete') initMapWhenReady();
  else window.addEventListener('load', initMapWhenReady);

  /**
   * THE SAME MAP THE APPS DRAW. See the matching note in tracking/index.html.
   *
   * The inline style below is a six-layer hand copy of
   * `@eyego/map-styles/eyego-dark.json`, which is the twenty-layer style both
   * apps actually render. `/map-style/dark.json` serves that real file, so the
   * web and the apps cannot drift; the inline object stays as the fallback for
   * a failed fetch, because a plain map beats no map.
   */
  const STYLE_URL = (CONFIG.apiBase || '') + '/map-style/dark.json';

  function buildMap() {
    const m = new maplibregl.Map({
      container: 'map',
      style: STYLE_URL,
      center: [-0.186964, 5.603717],
      zoom: 12,
      attributionControl: false,
    });
    m.on('error', function (e) {
      if (m.__fellBack || m.isStyleLoaded()) return;
      m.__fellBack = true;
      try { m.setStyle(FALLBACK_STYLE); } catch (_) {}
    });
    m.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
    return m;
  }

  var FALLBACK_STYLE = null;
  function buildMapLegacyStyle() {
    return {
      style: {
        version: 8,
        name: 'EyeGo Onyx',
        sources: {
          openfreemap: {
            type: 'vector',
            // The OTHER reason the map showed nothing: this was a hand-written
            // `/tiles/{z}/{x}/{y}.pbf` template, which 404s on every single
            // tile. OpenFreeMap publishes `/planet` as TileJSON — the same
            // source the native styles use.
            url: 'https://tiles.openfreemap.org/planet',
            attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> · <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
          }
        },
        glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
        layers: [
          { id: 'background', type: 'background', paint: { 'background-color': '#08090B' } },
          { id: 'water', type: 'fill', source: 'openfreemap', 'source-layer': 'water', paint: { 'fill-color': '#0C1A16' } },
          { id: 'building', type: 'fill', source: 'openfreemap', 'source-layer': 'building', paint: { 'fill-color': '#17171C', 'fill-opacity': 0.75, 'fill-outline-color': '#22222A' } },
          { id: 'road-minor', type: 'line', source: 'openfreemap', 'source-layer': 'transportation', filter: ['in', 'class', 'minor', 'service'], paint: { 'line-color': '#1F1F27', 'line-width': ['interpolate',['linear'],['zoom'],12,0.5,16,2] } },
          { id: 'road-major', type: 'line', source: 'openfreemap', 'source-layer': 'transportation', filter: ['in', 'class', 'primary', 'secondary', 'tertiary'], paint: { 'line-color': '#282833', 'line-width': ['interpolate',['linear'],['zoom'],10,1,16,4] } },
          { id: 'road-highway', type: 'line', source: 'openfreemap', 'source-layer': 'transportation', filter: ['in', 'class', 'motorway', 'trunk'], paint: { 'line-color': '#2C3A2E', 'line-width': ['interpolate',['linear'],['zoom'],8,1.5,16,6], 'line-opacity': 0.85 } }
        ]
      },
    };
  }
  FALLBACK_STYLE = buildMapLegacyStyle().style;

  // ── Draggable sheet ──────────────────────────────────────────
  const sheet = document.getElementById('sheet');
  const grabZone = document.getElementById('grabber-zone');
  const scroller = document.getElementById('sheet-scroll');
  const isRail = () => window.matchMedia('(min-width: 900px)').matches;
  let peeked = false;
  let dragStartY = null;
  let dragStartT = 0;
  let peekOffset = 0;

  function measurePeek() { peekOffset = Math.max(0, sheet.offsetHeight - 150); }
  function applySheet(px) { if (!isRail()) sheet.style.transform = 'translateY(' + px + 'px)'; }
  function settle(next) {
    peeked = next;
    sheet.classList.remove('dragging');
    applySheet(peeked ? peekOffset : 0);
  }
  window.addEventListener('resize', () => { measurePeek(); applySheet(peeked ? peekOffset : 0); });

  function dragStart(y) {
    if (isRail()) return;
    measurePeek();
    dragStartY = y;
    dragStartT = Date.now();
    sheet.classList.add('dragging');
  }
  function dragMove(y) {
    if (dragStartY === null) return;
    const base = peeked ? peekOffset : 0;
    let next = base + (y - dragStartY);
    if (next < 0) next = next / 3;
    if (next > peekOffset) next = peekOffset + (next - peekOffset) / 3;
    applySheet(next);
  }
  function dragEnd(y) {
    if (dragStartY === null) return;
    const dy = y - dragStartY;
    const dt = Math.max(1, Date.now() - dragStartT);
    const flick = Math.abs(dy) / dt > 0.5;
    const threshold = peekOffset / 3;
    if (flick) settle(dy > 0);
    else if (peeked) settle(dy > -threshold);
    else settle(dy > threshold);
    dragStartY = null;
  }

  grabZone.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientY), { passive: true });
  grabZone.addEventListener('touchmove', (e) => dragMove(e.touches[0].clientY), { passive: true });
  grabZone.addEventListener('touchend', (e) => dragEnd(e.changedTouches[0].clientY));
  grabZone.addEventListener('click', () => { if (!isRail()) { measurePeek(); settle(!peeked); } });
  scroller.addEventListener('touchstart', (e) => {
    if (scroller.scrollTop <= 0) dragStart(e.touches[0].clientY);
  }, { passive: true });
  scroller.addEventListener('touchmove', (e) => {
    if (dragStartY !== null) dragMove(e.touches[0].clientY);
  }, { passive: true });
  scroller.addEventListener('touchend', (e) => dragEnd(e.changedTouches[0].clientY));

  // ── State ────────────────────────────────────────────────────
  let originMarker = null;
  let destMarker = null;

  /**
   * MONEY IS INTEGER PESEWAS. 1 GHS = 100 pesewas.
   *
   * `trip.fare`, `trip.farePerSeatPesewas` and `fareEstimate.farePerPersonPesewas`
   * are all pesewas — the API has exactly one money unit and it is not cedis.
   * This page printed `GHS ${Number(trip.fare).toFixed(2)}` straight from that
   * field, so a GHS 4.80 seat advertised itself at GHS 480: a hundredfold
   * overstatement, on the one screen whose entire job is to convince someone
   * to take the seat.
   */
  function formatGhs(pesewas) {
    if (pesewas == null || !Number.isFinite(Number(pesewas))) return '—';
    return 'GHS ' + (Number(pesewas) / 100).toFixed(2);
  }

  // ── Fetch & render ───────────────────────────────────────────
  async function fetchData() {
    try {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timeout = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
      const res = await fetch(`${API_BASE}/v1/trips/join/${SHARE_TOKEN}/data`, {
        signal: ctrl ? ctrl.signal : undefined,
      }).finally(() => { if (timeout) clearTimeout(timeout); });
      if (!res.ok) {
        document.getElementById('loading').classList.add('hidden');
        if (res.status === 410) {
          showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', 'Invite expired', 'This invite link has expired. Ask the host to send a new one.');
        } else if (res.status === 404) {
          showError('This invite link is not valid.');
        } else {
          showError('Could not load ride details.');
        }
        return;
      }
      const json = await res.json();
      render(json.data ?? json);
      document.getElementById('loading').classList.add('hidden');
      measurePeek();
    } catch (e) {
      console.warn('Fetch failed', e);
      showError('Could not load ride details. Check your connection and try again.');
    }
  }

  function render(data) {
    const trip = data.trip || data;
    const fare = data.fareEstimate || {};
    const route = trip.route;
    const driver = trip.driver;
    const vehicle = trip.vehicle;
    const status = trip.status || 'SCHEDULED';
    const confirmedSeats = trip.confirmedSeats
      || (trip.bookings ? trip.bookings.filter((b) => b.status !== 'CANCELLED').length : 0);
    const maxSeats = trip.maxSeats || 14;
    const seatsLeft = maxSeats - confirmedSeats;

    // ── End states ───────────────────────────────────────────
    if (status === 'CANCELLED') {
      showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>', 'Trip cancelled', 'This trip has been cancelled. Ask the host to book a new one.');
      return;
    }
    if (status === 'COMPLETED') {
      showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4be277" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>', 'Trip completed', 'This trip has already finished.');
      return;
    }
    if (seatsLeft <= 0) {
      showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>', 'Trip full', 'Every seat on this trip is taken. Check back later, or book another ride.');
      return;
    }

    // ── Status badge ─────────────────────────────────────────
    const badge = document.getElementById('status-badge');
    if (seatsLeft <= 2) {
      badge.className = 'badge-full';
      badge.textContent = `${seatsLeft} seat${seatsLeft !== 1 ? 's' : ''} left`;
    } else {
      badge.className = 'badge-active';
      badge.textContent = 'Accepting';
    }

    if (route) {
      document.getElementById('topbar-sub').textContent =
        `${route.originName || 'Origin'} → ${route.destinationName || 'Destination'}`;
      document.getElementById('origin-name').textContent = route.originName || 'Origin';
      document.getElementById('dest-name').textContent = route.destinationName || 'Destination';
    }

    if (trip.departureTime) {
      const dt = new Date(trip.departureTime);
      document.getElementById('departure-time').textContent =
        dt.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
        dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    const seatsLeftEl = document.getElementById('seats-left');
    seatsLeftEl.textContent = `${seatsLeft}`;
    seatsLeftEl.className = `detail-value ${seatsLeft <= 2 ? 'warning' : ''}`;

    // Every candidate is pesewas; pick whichever the payload carries.
    const farePesewas =
      fare.farePerPersonPesewas != null ? fare.farePerPersonPesewas :
      trip.farePerSeatPesewas != null ? trip.farePerSeatPesewas :
      trip.fare != null ? trip.fare : null;
    document.getElementById('fare-per-seat').textContent = formatGhs(farePesewas);

    document.getElementById('trip-status').textContent =
      status === 'SCHEDULED' ? 'Upcoming' :
      status === 'FILLING' ? 'Booking open' :
      String(status).replace(/_/g, ' ').toLowerCase();

    // ── Driver ───────────────────────────────────────────────
    if (driver) {
      document.getElementById('driver-card').classList.add('visible');
      document.getElementById('driver-name').textContent = driver.name || 'Driver';
      const inner = document.getElementById('driver-avatar-inner');
      if (driver.profilePhoto) {
        const img = document.createElement('img');
        img.src = driver.profilePhoto;
        img.alt = driver.name || 'Driver';
        inner.replaceChildren(img);
      } else {
        inner.textContent = (driver.name || 'D')[0].toUpperCase();
      }
    }
    if (vehicle) {
      document.getElementById('driver-vehicle').textContent =
        `${vehicle.make || ''} ${vehicle.model || ''}${vehicle.tier ? ' · ' + vehicle.tier : ''}`.trim();
      document.getElementById('driver-plate').textContent = vehicle.plateNumber || vehicle.plate || '';
    }

    // ── Seats ────────────────────────────────────────────────
    const ind = document.getElementById('seat-indicator');
    ind.classList.add('visible');
    const dots = document.getElementById('seat-dots');
    dots.replaceChildren();
    for (let i = 0; i < maxSeats; i++) {
      const d = document.createElement('div');
      d.className = `seat-dot ${i < confirmedSeats ? 'taken' : 'free'}`;
      dots.appendChild(d);
    }
    document.getElementById('seat-text').textContent = `${confirmedSeats}/${maxSeats} seats`;

    document.getElementById('app-link').href = `eyego://join/${SHARE_TOKEN}`;

    // ── Map ──────────────────────────────────────────────────
    // Wrapped: a throw in here used to propagate out of render(), into
    // fetchData's catch, and replace a perfectly good ride sheet with
    // "Could not load ride details".
    if (!map) return;
    // Kept so `initMapWhenReady` can draw once MapLibre finishes loading — the
    // ride data now routinely arrives before the deferred map script does.
    lastRenderedData = data;
    // `data.path` is the server-computed road geometry for this trip's leg. See
    // updateMap: present means draw the real route, absent means fall back to
    // the two-point dashed hint.
    const drawSafely = () => { try { updateMap(route, data.path); } catch (err) { console.warn('Map draw failed', err); } };
    if (!map.isStyleLoaded()) map.once('idle', drawSafely);
    else drawSafely();
  }

  function createPinEl(kind) {
    const el = document.createElement('div');
    el.className = 'pin ' + (kind === 'dest' ? 'pin-dest' : 'pin-pickup');
    const inner = document.createElement('div');
    inner.className = 'pin-inner';
    el.appendChild(inner);
    return el;
  }

  function updateMap(route, path) {
    if (!map || !route || route.originLng == null || route.destLng == null) return;

    if (!originMarker) {
      originMarker = new maplibregl.Marker({ element: createPinEl('origin'), anchor: 'center' })
        .setLngLat([route.originLng, route.originLat])
        .setPopup(new maplibregl.Popup({ offset: 18, closeButton: false }).setText(route.originName || 'Pickup'))
        .addTo(map);
    }
    if (!destMarker) {
      destMarker = new maplibregl.Marker({ element: createPinEl('dest'), anchor: 'center' })
        .setLngLat([route.destLng, route.destLat])
        .setPopup(new maplibregl.Popup({ offset: 18, closeButton: false }).setText(route.destinationName || 'Destination'))
        .addTo(map);
    }

    /**
     * THE REAL ROAD when the server has it, a dashed hint only when it does not.
     *
     * The comment that used to be here said no road geometry is computed for an
     * unstarted trip. That was true of this page, not of the system: the trip's
     * pickup→dropoff leg is exactly what `route-geometry.service` computes, and
     * `/join/:token/data` now returns it as `path.geometry` (see
     * getTripByShareToken). Drawing a straight dashed line through buildings and
     * water while the server held the actual polyline is what the report was
     * about.
     *
     * Solid when it is the real route, dashed when it is a two-point guess, so
     * the line never claims more accuracy than it has.
     */
    var roadCoords = path && path.geometry && Array.isArray(path.geometry.coordinates)
      && path.geometry.coordinates.length > 1
      ? path.geometry.coordinates
      : null;
    var lineCoords = roadCoords || [[route.originLng, route.originLat], [route.destLng, route.destLat]];

    if (!map.getSource('route-hint')) {
      map.addSource('route-hint', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: lineCoords },
        },
      });
      map.addLayer({
        id: 'route-hint', type: 'line', source: 'route-hint',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: roadCoords
          ? { 'line-color': '#4be277', 'line-width': 5, 'line-opacity': 0.95 }
          : { 'line-color': '#4be277', 'line-width': 3, 'line-dasharray': [1.5, 2], 'line-opacity': 0.65 },
      });
    } else {
      // The geometry arrives with the data fetch, which can land after the map
      // is ready. Without this the first (straight) line was permanent.
      map.getSource('route-hint').setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: lineCoords },
      });
    }

    // Fit the ROUTE, not just its endpoints — a road that loops out around a
    // lagoon leaves the bbox of its two ends entirely.
    const bounds = new maplibregl.LngLatBounds();
    lineCoords.forEach(function (c) { bounds.extend(c); });
    bounds
      .extend([route.originLng, route.originLat])
      .extend([route.destLng, route.destLat]);
    // A degenerate bbox (origin === destination) makes fitBounds throw.
    if (!bounds.isEmpty() && bounds.getNorthEast().lng !== bounds.getSouthWest().lng) {
      map.fitBounds(bounds, { padding: { top: 110, bottom: 340, left: 50, right: 50 }, duration: 700, maxZoom: 15 });
    } else {
      map.easeTo({ center: [route.originLng, route.originLat], zoom: 14, duration: 600 });
    }
  }

  function showError(msg) {
    showEndState('<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>', 'Ride unavailable', msg);
  }

  function showEndState(iconSvg, title, body) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('end-icon').innerHTML = iconSvg;
    document.getElementById('end-title').textContent = title;
    document.getElementById('end-sub').textContent = body;
    document.getElementById('end-state').style.display = 'flex';
    document.getElementById('status-badge').style.display = 'none';
  }

  measurePeek();
  fetchData();
})();
</script>
</body>
</html>
